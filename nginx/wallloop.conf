# TOS platform nginx include — maps the /wallloop/ route to the local admin port.
# Location-block only (server{} is forbidden by the TOS spec, guide ch. 8.3.2.2).
# proxy_pass HAS a trailing slash on purpose: the /wallloop prefix is stripped,
# because WallLoop's panel uses fully relative asset/API paths and serves at "/".
# (Floating-window iframe mode, config.ini: type=iframe, path=/wallloop/, exec=false)
# NOTE: admin port 18241 (panel + management API), NOT the public 18240 player
# port — the panel must stay behind the TOS login, TVs use 18240 directly.
location /wallloop/ {
    proxy_pass http://127.0.0.1:18241/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    # Wallpaper videos can be large; match WALLLOOP_MAX_UPLOAD_BYTES (4 GiB)
    client_max_body_size 4g;
    proxy_request_buffering off;
}
